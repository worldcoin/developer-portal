services:
  postgres:
    image: postgres:14
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements,auto_explain
      - -c
      - pg_stat_statements.track=all
      - -c
      - auto_explain.log_min_duration=0
      - -c
      - auto_explain.log_analyze=on
      - -c
      - auto_explain.log_buffers=on
      - -c
      - auto_explain.log_nested_statements=on
      - -c
      - auto_explain.log_timing=off
    environment:
      POSTGRES_PASSWORD: password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 1s
      timeout: 5s
      retries: 30
    ports:
      - "127.0.0.1::5432"

  hasura:
    image: hasura/graphql-engine:v2.47.0.cli-migrations-v3
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      HASURA_GRAPHQL_ADMIN_SECRET: secret!
      HASURA_GRAPHQL_CLI_ENVIRONMENT: default
      HASURA_GRAPHQL_DATABASE_URL: postgres://postgres:password@postgres:5432/postgres
      HASURA_GRAPHQL_ENABLED_LOG_TYPES: startup,http-log,query-log
      HASURA_GRAPHQL_ENABLE_CONSOLE: "false"
      HASURA_GRAPHQL_JWT_SECRET: '{"key":"unsafe_AnEsZxveGsAWoENHGAnEsZxveGsAvxgMtDq9UxgTsDq9UxgTsNHGWoENIoJ","type":"HS512"}'
      HASURA_GRAPHQL_METADATA_DIR: /hasura-metadata
      HASURA_GRAPHQL_MIGRATIONS_DIR: /hasura-migrations
      HASURA_GRAPHQL_STRINGIFY_NUMERIC_TYPES: "true"
      HASURA_GRAPHQL_UNAUTHORIZED_ROLE: public
      INTERNAL_ENDPOINTS_SECRET: world-id-analytics-test-secret
      NEXT_API_URL: http://host.docker.internal:9/api
    ports:
      - "127.0.0.1::8080"
    volumes:
      - "${WIA_REPOSITORY_ROOT:?repository root required}/hasura/migrations:/hasura-migrations:ro"
      - "${WIA_REPOSITORY_ROOT:?repository root required}/hasura/metadata:/hasura-metadata:ro"
      - "${WIA_REPOSITORY_ROOT:?repository root required}/hasura:/hasura-project:ro"
