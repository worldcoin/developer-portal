mutation ClaimProductionRpRetry(
  $rp_id: String!
  $manager_key: String!
  $signer: String!
) {
  update_rp_registration(
    where: {
      rp_id: { _eq: $rp_id }
      mode: { _eq: managed }
      status: { _eq: failed }
      manager_kms_key_id: { _eq: $manager_key }
      signer_address: { _eq: $signer }
    }
    _set: { status: pending }
  ) {
    affected_rows
    returning {
      updated_at
    }
  }
}

mutation ClaimStagingRpRetry(
  $rp_id: String!
  $manager_key: String!
  $signer: String!
) {
  update_rp_registration(
    where: {
      rp_id: { _eq: $rp_id }
      mode: { _eq: managed }
      staging_status: { _eq: failed }
      manager_kms_key_id: { _eq: $manager_key }
      signer_address: { _eq: $signer }
    }
    _set: { staging_status: pending }
  ) {
    affected_rows
    returning {
      updated_at
    }
  }
}
