mutation UpdateProductionRetry(
  $rp_id: String!
  $claimed_at: timestamptz!
  $operation_hash: String!
  $status: rp_registration_status!
) {
  update_rp_registration(
    where: {
      rp_id: { _eq: $rp_id }
      updated_at: { _eq: $claimed_at }
      status: { _eq: pending }
    }
    _set: { operation_hash: $operation_hash, status: $status }
  ) {
    affected_rows
  }
}
