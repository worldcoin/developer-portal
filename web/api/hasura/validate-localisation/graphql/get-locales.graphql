query GetLocales($id: String!, $team_id: String!, $user_id: String!) {
  app_metadata(
    where: {
      id: { _eq: $id }
      app: {
        team_id: { _eq: $team_id }
        team: {
          memberships: {
            user_id: { _eq: $user_id }
            role: { _in: [ADMIN, OWNER] }
          }
        }
      }
    }
  ) {
    supported_languages
    app_mode
  }
}
