mutation ClaimModeSwitchSlot(
  $rp_id: String!
  $staging_filter: rp_registration_bool_exp! = {}
) {
  update_rp_registration(
    where: {
      _and: [$staging_filter]
      rp_id: { _eq: $rp_id }
      status: { _eq: registered }
    }
    _set: { status: pending }
  ) {
    affected_rows
    returning {
      rp_id
      app_id
      status
      manager_kms_key_id
    }
  }
}
