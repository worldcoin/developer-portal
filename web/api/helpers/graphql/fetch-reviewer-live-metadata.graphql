query FetchReviewerLiveMetadata($appId: String!) {
  app_metadata(
    where: {
      app_id: { _eq: $appId }
      verification_status: { _eq: "verified" }
      is_reviewer_world_app_approved: { _eq: true }
    }
    order_by: { verified_at: desc }
    limit: 1
  ) {
    id
    app_id
    app_mode
    app_website_url
    associated_domains
    can_import_all_contacts
    can_use_attestation
    category
    content_card_image_url
    contracts
    created_at
    description
    hero_image_url
    integration_url
    is_allowed_unlimited_notifications
    is_android_only
    is_developer_allow_listing
    is_for_humans_only
    is_reviewer_app_store_approved
    is_reviewer_world_app_approved
    logo_img_url
    max_notifications_per_day
    meta_tag_image_url
    name
    permit2_tokens
    review_message
    short_name
    should_uninstall_on_delist
    showcase_img_urls
    source_code_url
    support_link
    supported_countries
    supported_languages
    updated_at
    verification_status
    verified_at
    whitelisted_addresses
    world_app_button_text
    world_app_description
    localisations(order_by: [{ locale: asc }, { id: asc }]) {
      id
      app_metadata_id
      locale
      name
      short_name
      world_app_button_text
      world_app_description
      description
      hero_image_url
      meta_tag_image_url
      showcase_img_urls
      created_at
      updated_at
    }
  }
}
