mutation UpdateSandboxRequestIosStatus(
  $id: String!
  $from_status: sandbox_access_request_ios_status!
  $set: sandbox_access_request_ios_set_input!
) {
  update_sandbox_access_request_ios(
    where: { id: { _eq: $id }, status: { _eq: $from_status } }
    _set: $set
  ) {
    affected_rows
    returning {
      status
    }
  }
}
