query FetchReviewChecklistContext($submission_id: uuid!) {
  app_review_submission_by_pk(id: $submission_id) {
    id
    app_mode
    checklist_version
  }
}

query FetchReviewWorkflowOutcome($submission_id: uuid!) {
  app_review_submission_by_pk(id: $submission_id) {
    id
    status
    review_version
    claim_token
    claim_expires_at
    claimed_by_subject
    checklist_version
    checklist
    events(
      where: {
        event_type: {
          _in: [
            "claimed"
            "claim_heartbeat"
            "claim_released"
            "checklist_updated"
          ]
        }
      }
      order_by: { event_sequence: desc }
      limit: 8
    ) {
      event_type
      actor_subject
      review_version
      payload
    }
  }
}

query FetchReviewDecisionContext($submission_id: uuid!) {
  app_review_submission_by_pk(id: $submission_id) {
    id
    status
    review_version
    claim_token
    claim_expires_at
    claimed_by_subject
    checklist_version
    checklist
    app_metadata_id
    app_id
    team_id
    app_mode
    listing_target
    listing_consent
    metadata_updated_at
    asset_snapshot
    metadata_snapshot
    localizations_snapshot
    decision_fingerprint
    decision_result
    decided_by_subject
    app_metadata {
      id
      app_id
      updated_at
      verification_status
      app_mode
      is_developer_allow_listing
      integration_url
    }
    app {
      id
      is_staging
      is_banned
      deleted_at
      status
      is_archived
      first_verified_at
      app_metadata(where: { verification_status: { _eq: "verified" } }) {
        id
        app_id
        updated_at
        verification_status
        logo_img_url
        hero_image_url
        meta_tag_image_url
        content_card_image_url
        showcase_img_urls
        localisations(order_by: [{ locale: asc }, { id: asc }]) {
          id
          app_metadata_id
          locale
          name
          description
          world_app_button_text
          world_app_description
          short_name
          created_at
          updated_at
          hero_image_url
          meta_tag_image_url
          showcase_img_urls
        }
      }
    }
  }
}

query FetchReviewDecisionOutcome($submission_id: uuid!) {
  app_review_submission_by_pk(id: $submission_id) {
    id
    status
    review_version
    claim_token
    claim_expires_at
    checklist_version
    checklist
    decision_fingerprint
    decision_result
    decided_by_subject
  }
}

query HasActiveListingReview($app_metadata_id: String!) {
  app_review_submission(
    limit: 1
    where: {
      app_metadata_id: { _eq: $app_metadata_id }
      status: { _in: ["pending", "in_review"] }
    }
  ) {
    id
  }
}

mutation ClaimReviewNotifications($worker_id: String!, $limit: Int!) {
  reviewer_claim_app_review_notifications(
    args: { p_worker_id: $worker_id, p_limit: $limit }
  ) {
    id
    submission_id
    notification_type
    channel
    status
    recipient
    payload
    attempt_count
    locked_at
    locked_by
  }
}

query FetchReviewNotificationContext($notification_id: uuid!) {
  app_review_notification_by_pk(id: $notification_id) {
    id
    submission_id
    notification_type
    channel
    status
    recipient
    payload
    attempt_count
    locked_at
    locked_by
    submission {
      id
      app_id
      app_metadata_id
      app_mode
      listing_target
      status
      review_version
      decision_fingerprint
      decision_result
      changelog
      submitted_at
      decision_summary
      metadata_snapshot
      team_id
      claim_expires_at
      app {
        name
      }
      team {
        name
      }
    }
  }
}

mutation CompleteReviewNotification(
  $notification_id: uuid!
  $worker_id: String!
  $outcome: String!
  $provider_message_id: String
  $error: String
) {
  reviewer_complete_app_review_notification(
    args: {
      p_notification_id: $notification_id
      p_worker_id: $worker_id
      p_outcome: $outcome
      p_provider_message_id: $provider_message_id
      p_error: $error
    }
  ) {
    id
    status
    attempt_count
    next_attempt_at
    delivered_at
  }
}

mutation ReconcileReviewAssetCleanup(
  $notification_id: uuid!
  $submission_id: uuid!
  $decision_fingerprint: String!
  $operation_id: String!
  $expected_review_version: Int!
  $app_metadata_id: String!
  $asset_keys: jsonb!
  $worker_id: String!
) {
  reviewer_reconcile_app_review_asset_cleanup(
    args: {
      p_notification_id: $notification_id
      p_submission_id: $submission_id
      p_decision_fingerprint: $decision_fingerprint
      p_operation_id: $operation_id
      p_expected_review_version: $expected_review_version
      p_app_metadata_id: $app_metadata_id
      p_asset_keys: $asset_keys
      p_worker_id: $worker_id
    }
  ) {
    id
    payload
  }
}

mutation RetryReviewNotification(
  $notification_id: uuid!
  $operation_id: uuid!
  $actor_subject: String!
  $actor_email: String!
) {
  reviewer_retry_app_review_notification(
    args: {
      p_notification_id: $notification_id
      p_operation_id: $operation_id
      p_actor_subject: $actor_subject
      p_actor_email: $actor_email
    }
  ) {
    id
    status
    attempt_count
    next_attempt_at
    delivered_at
  }
}

query FetchReviewNotificationRetryOutcome(
  $notification_id: uuid!
  $actor_subject: String!
  $event_payload: jsonb!
) {
  app_review_notification_by_pk(id: $notification_id) {
    id
    submission_id
    status
    attempt_count
    next_attempt_at
    delivered_at
  }
  app_review_event(
    limit: 1
    order_by: { event_sequence: desc }
    where: {
      event_type: { _eq: "notification_retry_requested" }
      actor_subject: { _eq: $actor_subject }
      payload: { _contains: $event_payload }
    }
  ) {
    submission_id
  }
}

