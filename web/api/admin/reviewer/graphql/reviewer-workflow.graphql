query FetchReviewChecklistContext($submission_id: uuid!) {
  app_review_submission_by_pk(id: $submission_id) {
    id
    app_mode
    checklist_version
  }
}

query FetchReviewDecisionContext($submission_id: uuid!) {
  app_review_submission_by_pk(id: $submission_id) {
    id
    status
    review_version
    claim_token
    claim_expires_at
    claimed_by_subject
    checklist_version
    checklist
    app_metadata_id
    app_id
    team_id
    app_mode
    listing_target
    listing_consent
    metadata_updated_at
    metadata_snapshot
    localizations_snapshot
    decision_fingerprint
    decision_result
    decided_by_subject
    app_metadata {
      id
      app_id
      updated_at
      verification_status
      app_mode
      is_developer_allow_listing
    }
    app {
      id
      is_staging
      deleted_at
      first_verified_at
      app_metadata(where: { verification_status: { _eq: "verified" } }) {
        id
        app_id
        updated_at
        verification_status
        logo_img_url
        hero_image_url
        meta_tag_image_url
        content_card_image_url
        showcase_img_urls
        localisations(order_by: [{ locale: asc }, { id: asc }]) {
          id
          app_metadata_id
          locale
          name
          description
          world_app_button_text
          world_app_description
          short_name
          created_at
          updated_at
          hero_image_url
          meta_tag_image_url
          showcase_img_urls
        }
      }
    }
  }
}

query FetchReviewDecisionOutcome($submission_id: uuid!) {
  app_review_submission_by_pk(id: $submission_id) {
    id
    status
    review_version
    claim_token
    claim_expires_at
    checklist_version
    checklist
    decision_fingerprint
    decision_result
    decided_by_subject
  }
}

query HasActiveListingReview($app_metadata_id: String!) {
  app_review_submission(
    limit: 1
    where: {
      app_metadata_id: { _eq: $app_metadata_id }
      status: { _in: ["pending", "in_review"] }
    }
  ) {
    id
  }
}

mutation ClaimReviewSubmission(
  $submission_id: uuid!
  $expected_review_version: Int!
  $actor_subject: String!
  $actor_email: String!
) {
  reviewer_claim_app_review_submission(
    args: {
      p_submission_id: $submission_id
      p_expected_review_version: $expected_review_version
      p_actor_subject: $actor_subject
      p_actor_email: $actor_email
    }
  ) {
    id
    status
    review_version
    claim_token
    claim_expires_at
    checklist_version
    checklist
  }
}

