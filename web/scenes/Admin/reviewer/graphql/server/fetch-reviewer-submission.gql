query FetchReviewerSubmission($reviewId: uuid!) {
  app_review_submission_by_pk(id: $reviewId) {
    id
    app_id
    app_metadata_id
    app_mode
    asset_snapshot
    asset_snapshot_repair_attempt_count
    asset_snapshot_repair_dead_lettered_at
    asset_snapshot_repair_last_error
    asset_snapshot_repair_next_at
    attempt
    changelog
    checklist
    checklist_version
    claimed_at
    claimed_by_email
    claim_expires_at
    completed_at
    decided_at
    decided_by_email
    decision_summary
    listing_consent
    listing_target
    localizations_snapshot
    metadata_snapshot
    metadata_updated_at
    review_version
    status
    submitted_at
    world_id_configuration_snapshot
    app {
      name
    }
    team {
      id
      name
    }
    events(order_by: [{ event_sequence: desc }, { id: desc }]) {
      id
      event_type
      event_sequence
      actor_email
      actor_subject
      created_at
      payload
      review_version
    }
    notifications(order_by: [{ created_at: desc }, { id: desc }]) {
      id
      attempt_count
      channel
      created_at
      delivered_at
      last_attempt_at
      last_error
      manual_retry_blocked
      next_attempt_at
      notification_type
      provider_message_id
      recipient
      status
      updated_at
    }
  }
}
