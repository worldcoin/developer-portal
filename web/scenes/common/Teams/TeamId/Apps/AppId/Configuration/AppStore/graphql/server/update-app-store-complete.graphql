mutation UpdateAppStoreComplete(
  $app_metadata_id: String!
  $app_metadata_input: app_metadata_set_input!
  $localisations_to_upsert: [localisations_insert_input!]!
) {
  update_app_metadata(
    where: {
      _and: [
        { id: { _eq: $app_metadata_id } }
        { verification_status: { _eq: "unverified" } }
      ]
    }
    _set: $app_metadata_input
  ) {
    affected_rows
  }

  # Upsert localisations (insert or update based on unique constraint)
  insert_localisations(
    objects: $localisations_to_upsert
    on_conflict: {
      constraint: unique_app_metadata_locale
      update_columns: [
        name
        short_name
        world_app_description
        description
        world_app_button_text
        meta_tag_image_url
        showcase_img_urls
        hero_image_url
      ]
    }
  ) {
    # The rows the browser's Apollo cache is patched with after this server
    # action returns. Must stay in sync with the FetchLocalisations selection
    # set — see fetch-localisations.graphql.
    returning {
      id
      locale
      name
      description
      world_app_button_text
      world_app_description
      short_name
      hero_image_url
      meta_tag_image_url
      showcase_img_urls
    }
  }
}
