query FetchAppMetadataById($app_metadata_id: String!) {
  app_metadata(
    where: {
      _and: [
        { app: { deleted_at: { _is_null: true } } }
        { id: { _eq: $app_metadata_id } }
        { verification_status: { _eq: "unverified" } }
      ]
    }
  ) {
    id
    app_id
    updated_at
    name
    short_name
    logo_img_url
    showcase_img_urls
    meta_tag_image_url
    world_app_description
    description
    category
    integration_url
    app_website_url
    support_link
    supported_countries
    supported_languages
    is_android_only
    is_for_humans_only
    app_mode
    verification_status
    content_card_image_url
    app {
      id
      team_id
      is_staging
      is_banned
      status
      is_archived
    }
  }
  localisations(
    where: { app_metadata_id: { _eq: $app_metadata_id } }
    order_by: [{ locale: asc }, { id: asc }]
  ) {
    id
    app_metadata_id
    locale
    name
    short_name
    world_app_button_text
    world_app_description
    description
    hero_image_url
    meta_tag_image_url
    showcase_img_urls
    created_at
    updated_at
  }
}
