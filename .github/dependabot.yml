version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "monthly"
    versioning-strategy: increase
    open-pull-requests-limit: 10
    reviewers:
      - "andy-t-wang"
      - "michalstruck"
    assignees:
      - "Takaros999"
      - "Dzejkop"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14
    groups:
      github-actions:
        patterns:
          - "*"
    assignees:
      - "Takaros999"
      - "Dzejkop"
