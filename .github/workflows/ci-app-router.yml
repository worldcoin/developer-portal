name: CI

on:
  pull_request:
    paths-ignore:
      - "README.md"
      - "CODEOWNERS"
      - ".github/pull_request_template.md"
      - ".github/dependabot.yml"
      - ".github/workflows/relyance-sci.yml"
      - ".vscode/**"
      - "tests/**"

permissions: {}

jobs:
  lint:
    permissions:
      contents: read
    name: Code formatting & linting
    runs-on:
      group: arc-public-large-amd64-runner
    timeout-minutes: 3
    defaults:
      run:
        working-directory: web
    steps:
      # v7.0.1 https://github.com/actions/checkout/releases/tag/v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # v6.1.1 https://github.com/pnpm/action-setup/releases/tag/v6.1.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
        with:
          package_json_file: web/package.json

      - name: Set up Node.js
        # v7.1.0 https://github.com/actions/setup-node/releases/tag/v7.1.0
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.23.4
          cache: "pnpm"
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting with Prettier
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Check Typescript
        run: pnpm typecheck

  build:
    permissions:
      contents: read
    name: Test build
    runs-on:
      group: arc-public-xlarge-amd64-runner
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      # v7.0.1 https://github.com/actions/checkout/releases/tag/v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # v6.1.1 https://github.com/pnpm/action-setup/releases/tag/v6.1.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
        with:
          package_json_file: web/package.json

      - name: Set up Node.js
        # v7.1.0 https://github.com/actions/setup-node/releases/tag/v7.1.0
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.23.4
          cache: "pnpm"
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        env:
          GENERAL_SECRET_KEY: unsafe_test_key
          HASURA_GRAPHQL_JWT_SECRET: '{"key": "unsafe_AnEsZxveGsAWoENHGAnEsZxveGsAvxgMtDq9UxgTsDq9UxgTsNHGWoENIoJ", "type": "HS512"}'
          JWT_ISSUER: invalid.localhost
          NEXT_PUBLIC_PROFILE_ROUTE: /api/auth/profile
          # Dummy build-time Auth0 config: web/lib/auth0.ts constructs the v4
          # Auth0Client at module scope, which logs a "missing options" error
          # when these are absent. Real values are injected at runtime.
          AUTH0_DOMAIN: build.invalid.auth0.com
          AUTH0_CLIENT_ID: unsafe_build_client_id
          AUTH0_CLIENT_SECRET: unsafe_build_client_secret
          AUTH0_SECRET: unsafe_build_secret
        run: pnpm build

  docker-build:
    permissions:
      contents: read
    name: Test Docker build
    runs-on:
      group: arc-public-large-amd64-runner
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      # v7.0.1 https://github.com/actions/checkout/releases/tag/v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Cache Docker layers
        # v6.1.0 https://github.com/actions/cache/releases/tag/v6.1.0
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cache/docker
          key: ${{ runner.os }}-docker-${{ hashFiles('**/Dockerfile') }}

      - name: Build Docker image
        run: docker build --cache-from developer-portal-test:latest -t developer-portal-test:latest .

  api-tests:
    permissions:
      contents: read
    name: API Tests
    runs-on:
      group: arc-public-xlarge-amd64-runner
    timeout-minutes: 3
    defaults:
      run:
        working-directory: web
    steps:
      # v7.0.1 https://github.com/actions/checkout/releases/tag/v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # v6.1.1 https://github.com/pnpm/action-setup/releases/tag/v6.1.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
        with:
          package_json_file: web/package.json

      - name: Set up Node.js
        # v7.1.0 https://github.com/actions/setup-node/releases/tag/v7.1.0
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.23.4
          cache: "pnpm"
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run API tests
        run: |
          pnpm test:api

  integration-tests:
    permissions:
      contents: read
    name: Integration Tests
    runs-on:
      group: arc-public-large-amd64-runner
    timeout-minutes: 3
    defaults:
      run:
        working-directory: web

    steps:
      # v7.0.1 https://github.com/actions/checkout/releases/tag/v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # v6.1.1 https://github.com/pnpm/action-setup/releases/tag/v6.1.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
        with:
          package_json_file: web/package.json

      - name: Run services
        run: |
          docker compose -f ../docker-compose-test.yaml up -d hasura_test

      - name: Set up Node.js
        # v7.1.0 https://github.com/actions/setup-node/releases/tag/v7.1.0
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.23.4
          cache: "pnpm"
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run integration tests
        run: |
          pnpm test:integration

  e2e-tests:
    permissions:
      contents: read
    name: End-to-end Tests
    runs-on:
      group: arc-public-2xlarge-amd64-runner
    timeout-minutes: 10
    environment: development

    defaults:
      run:
        working-directory: web

    steps:
      # v7.0.1 https://github.com/actions/checkout/releases/tag/v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # v6.1.1 https://github.com/pnpm/action-setup/releases/tag/v6.1.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
        with:
          package_json_file: web/package.json

      - name: Run backend services
        run: |
          docker compose -f ../docker-compose.yaml up -d

      - name: Set up Node.js
        # v7.1.0 https://github.com/actions/setup-node/releases/tag/v7.1.0
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.23.4
          cache: "pnpm"
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium with dependencies
        run: pnpm exec playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: pnpm test:e2e
        env:
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_GRAPHQL_API_URL: ${{ vars.NEXT_PUBLIC_GRAPHQL_API_URL }}
          NEXT_PUBLIC_PROFILE_ROUTE: /api/auth/profile
          HASURA_GRAPHQL_ADMIN_SECRET: ${{ secrets.HASURA_GRAPHQL_ADMIN_SECRET }}
          HASURA_GRAPHQL_JWT_SECRET: ${{ secrets.HASURA_GRAPHQL_JWT_SECRET }}
          JWT_ISSUER: ${{ vars.JWT_ISSUER }}
          INTERNAL_ENDPOINTS_SECRET: ${{ secrets.INTERNAL_ENDPOINTS_SECRET }}
          GENERAL_SECRET_KEY: ${{ secrets.GENERAL_SECRET_KEY }}
          AUTH0_DOMAIN: ${{ secrets.AUTH0_DOMAIN }}
          AUTH0_SECRET: ${{ secrets.AUTH0_SECRET }}
          AUTH0_BASE_URL: ${{ vars.AUTH0_BASE_URL }}
          AUTH0_ISSUER_BASE_URL: ${{ secrets.AUTH0_ISSUER_BASE_URL }}
          AUTH0_CLIENT_ID: ${{ secrets.AUTH0_CLIENT_ID }}
          AUTH0_CLIENT_SECRET: ${{ secrets.AUTH0_CLIENT_SECRET }}
          TEST_USER_AUTH0_ID: ${{ secrets.TEST_USER_AUTH0_ID }}
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}

  unit-tests:
    permissions:
      contents: read
    name: Unit Tests
    runs-on:
      group: arc-public-large-amd64-runner
    timeout-minutes: 8
    defaults:
      run:
        working-directory: web

    steps:
      # v7.0.1 https://github.com/actions/checkout/releases/tag/v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # v6.1.1 https://github.com/pnpm/action-setup/releases/tag/v6.1.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
        with:
          package_json_file: web/package.json

      - name: Set up Node.js
        # v7.1.0 https://github.com/actions/setup-node/releases/tag/v7.1.0
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.23.4
          cache: "pnpm"
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: |
          pnpm test:unit
