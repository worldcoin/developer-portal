name: Workflow security

on:
  pull_request:
    paths:
      - ".github/**"
  push:
    branches: [main]
    paths:
      - ".github/**"
  workflow_dispatch:

permissions: {}

jobs:
  zizmor:
    name: Zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      # v7.0.1 https://github.com/actions/checkout/releases/tag/v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # v0.9.0 https://github.com/zizmorcore/zizmor-action/releases/tag/v0.9.0
      - uses: zizmorcore/zizmor-action@bd12b495c90993a4301c73398142281a61499af3
        with:
          version: "1.33.1"
          inputs: .github/workflows
          strict-collection: true
          advanced-security: false
