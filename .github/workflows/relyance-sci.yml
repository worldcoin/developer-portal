name: Relyance SCI Scan

on:
  schedule:
    - cron: "36 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  execute-relyance-sci:
    name: Relyance SCI Job
    runs-on:
      group: arc-public-large-amd64-runner
    permissions:
      contents: read

    steps:
      - name: Run Relyance SCI
        # main https://github.com/worldcoin/gh-actions-public/commit/ddc98819e4f0b1d83ae632107b0e7d04059e53fa
        uses: worldcoin/gh-actions-public/relyance@ddc98819e4f0b1d83ae632107b0e7d04059e53fa
        # More information: https://github.com/worldcoin/gh-actions-public/tree/main/relyance
        with:
          secrets-dpp-sci-key: ${{ secrets.DPP_SCI_KEY }}
