name: World Developer plugin

on:
  pull_request:
    paths:
      - ".agents/plugins/**"
      - "plugins/world-developer/**"
      - ".github/workflows/world-plugin.yml"
  push:
    branches: [main]
    paths:
      - ".agents/plugins/**"
      - "plugins/world-developer/**"
      - ".github/workflows/world-plugin.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Plugin core (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node: [20, 22]
    defaults:
      run:
        working-directory: plugins/world-developer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: plugins/world-developer/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci --ignore-scripts
      - run: npm run format:check
      - run: npm test
      - run: python3 -B -m unittest discover -s tests -p 'test_*.py'
