name: World Developer plugin

on:
  pull_request:
    paths:
      - ".agents/plugins/**"
      - "plugins/world-developer/**"
      - "web/api/mcp/**"
      - "web/api/helpers/test-proofs.ts"
      - "web/scripts/generate-mcp-contract.ts"
      - "web/scripts/lib/static-mcp-contract.ts"
      - "web/tests/unit/static-mcp-contract.test.ts"
      - "web/tests/api/mcp.test.ts"
      - ".github/workflows/world-plugin.yml"
  push:
    branches: [main]
    paths:
      - ".agents/plugins/**"
      - "plugins/world-developer/**"
      - "web/api/mcp/**"
      - "web/api/helpers/test-proofs.ts"
      - "web/scripts/generate-mcp-contract.ts"
      - "web/scripts/lib/static-mcp-contract.ts"
      - ".github/workflows/world-plugin.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Plugin package (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node: [20, 22]
    defaults:
      run:
        working-directory: plugins/world-developer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: plugins/world-developer/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run format:check
      - run: npm test
      - run: python3 -B -m unittest discover -s tests -p 'test_*.py'
      - name: Verify independent grader containment
        if: matrix.node == 20
        run: |
          docker pull node:20-alpine
          WORLD_EVAL_DOCKER_TEST=1 node --test tests/evaluation-sandbox.test.mjs
      - name: Install from a clean Codex catalog
        if: matrix.node == 20
        run: |
          npm exec --yes --package=@openai/codex@0.149.1 -- codex plugin marketplace add ../..
          npm exec --yes --package=@openai/codex@0.149.1 -- codex plugin add world-developer@world
          npm exec --yes --package=@openai/codex@0.149.1 -- codex plugin list --json | node -e '
            let input = "";
            process.stdin.on("data", chunk => input += chunk);
            process.stdin.on("end", () => {
              const expected = require("./package.json").version;
              const plugin = JSON.parse(input).installed.find(p => p.pluginId === "world-developer@world");
              if (!plugin?.enabled || plugin.version !== expected) process.exit(1);
            });'
      - name: Build distributable archive
        run: node scripts/build-release.mjs --output-dir "$RUNNER_TEMP/world-plugin-release"
      - uses: actions/upload-artifact@v4
        if: matrix.node == 20
        with:
          name: world-developer-plugin
          path: ${{ runner.temp }}/world-plugin-release/*.tar.gz
          if-no-files-found: error

  contract:
    name: Portal/plugin contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsx scripts/generate-mcp-contract.ts --check
      - run: pnpm exec jest tests/unit/static-mcp-contract.test.ts tests/api/mcp.test.ts --runInBand

  release:
    name: Publish stable plugin release
    needs: [package, contract]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: world-developer-plugin-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: world-developer-plugin
          path: release-artifacts
      - name: Publish version once
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./plugins/world-developer/.codex-plugin/plugin.json').version")
          tag="world-developer-v${version}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; preserving it."
            exit 0
          fi
          existing_tag=$(git ls-remote --tags origin "refs/tags/$tag")
          if [ -n "$existing_tag" ]; then
            echo "Tag $tag exists without a release; inspect it before publishing."
            exit 1
          fi
          gh release create "$tag" "release-artifacts/${tag}.tar.gz" \
            --target "$GITHUB_SHA" \
            --title "World Developer ${version}" \
            --notes-file plugins/world-developer/RELEASE_NOTES.md \
            --latest=false
