name: API Tests Code Quality

on:
  pull_request:
    paths:
      - "tests/api/**"

permissions: {}

jobs:
  lint:
    permissions:
      contents: read
    name: Code formatting & linting
    runs-on:
      group: arc-public-large-amd64-runner
    timeout-minutes: 3
    defaults:
      run:
        working-directory: tests/api
    steps:
      # v7.0.1 https://github.com/actions/checkout/releases/tag/v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # v6.1.1 https://github.com/pnpm/action-setup/releases/tag/v6.1.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
        with:
          package_json_file: tests/api/package.json

      - name: Set up Node 22
        # v7.1.0 https://github.com/actions/setup-node/releases/tag/v7.1.0
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.23.4
          cache: "pnpm"
          cache-dependency-path: tests/api/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting and linting
        run: pnpm lint

  typecheck:
    permissions:
      contents: read
    name: Code typechecking
    runs-on:
      group: arc-public-large-amd64-runner
    timeout-minutes: 3
    defaults:
      run:
        working-directory: tests/api
    steps:
      # v7.0.1 https://github.com/actions/checkout/releases/tag/v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # v6.1.1 https://github.com/pnpm/action-setup/releases/tag/v6.1.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
        with:
          package_json_file: tests/api/package.json

      - name: Set up Node 22
        # v7.1.0 https://github.com/actions/setup-node/releases/tag/v7.1.0
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.23.4
          cache: "pnpm"
          cache-dependency-path: tests/api/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check TypeScript typechecking
        run: pnpm typecheck
