services:
  postgres:
    image: postgres:16
    ports:
      - "5432:5432"
    healthcheck:
      test: "pg_isready -U postgres"
      interval: 2s
      timeout: 10s
      retries: 5
    environment:
      POSTGRES_PASSWORD: password

  hasura:
    # remember to update developer-portal-deployment with the same image
    image: hasura/graphql-engine:v2.47.0.cli-migrations-v3
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      HASURA_GRAPHQL_DATABASE_URL: postgres://postgres:password@postgres:5432/postgres
      HASURA_GRAPHQL_ENABLE_CONSOLE: "true"
      HASURA_GRAPHQL_ADMIN_SECRET: secret!
      HASURA_GRAPHQL_ENABLED_LOG_TYPES: "startup, http-log, webhook-log, websocket-log, query-log"
      HASURA_GRAPHQL_MIGRATIONS_DIR: /hasura-migrations
      HASURA_GRAPHQL_METADATA_DIR: /hasura-metadata
      HASURA_GRAPHQL_JWT_SECRET: '{"key": "unsafe_vxgMtDq9UxgTsDq9UxgTsNHGAnEsZxveGsAWoENHGAnEsZxveGsAWoENIoJ", "type": "HS512"}'
      HASURA_GRAPHQL_STRINGIFY_NUMERIC_TYPES: "true"
      HASURA_GRAPHQL_UNAUTHORIZED_ROLE: public
      NEXT_API_URL: "http://host.docker.internal:3000/api"
      INTERNAL_ENDPOINTS_SECRET: xnEU6vvqPMkc5UYEPVWM2IArdQ2eWv7A9
    volumes:
      - ./hasura/migrations:/hasura-migrations
      - ./hasura/metadata:/hasura-metadata
    extra_hosts:
      - "host.docker.internal:host-gateway"
  redis:
    image: redis:6
    ports:
      - "6379:6379"

  localstack:
    image: localstack/localstack:2026.07.0
    profiles: [localstack]
    ports:
      - "127.0.0.1:4566:4566"
    environment:
      LOCALSTACK_AUTH_TOKEN: ${LOCALSTACK_AUTH_TOKEN:-}
    configs:
      - source: localstack_s3_init
        target: /etc/localstack/init/ready.d/10-s3.sh
        mode: 0555

  opensearch:
    image: opensearchproject/opensearch:3
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - "DISABLE_SECURITY_PLUGIN=true"
      - "DISABLE_INSTALL_DEMO_CONFIG=true"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "9200:9200"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'curl -s http://localhost:9200/_cluster/health | grep -q ''"status":"green"''',
        ]
      interval: 10s
      timeout: 10s
      retries: 5

configs:
  localstack_s3_init:
    content: |
      #!/bin/sh
      set -eu

      if ! awslocal s3api head-bucket --bucket developer-portal-assets >/dev/null 2>&1; then
        awslocal s3api create-bucket --bucket developer-portal-assets
      fi

      awslocal s3api put-bucket-cors \
        --bucket developer-portal-assets \
        --cors-configuration \
        '{"CORSRules":[{"AllowedOrigins":["http://localhost:3000"],"AllowedMethods":["GET","HEAD","POST"],"AllowedHeaders":["*"],"ExposeHeaders":["ETag"]}]}'
