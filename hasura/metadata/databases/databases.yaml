- name: default
  kind: postgres
  configuration:
    connection_info:
      database_url:
        from_env: HASURA_GRAPHQL_DATABASE_URL
      isolation_level: read-committed
      pool_settings:
        connection_lifetime: 300
        max_connections: 60
      use_prepared_statements: true
  tables: "!include default/tables/tables.yaml"
  functions: "!include default/functions/functions.yaml"
  logical_models:
    - name: admin_dashboard_inventory
      fields:
        - name: active_api_keys
          type:
            scalar: bigint
            nullable: false
        - name: active_apps
          type:
            scalar: bigint
            nullable: false
        - name: active_teams
          type:
            scalar: bigint
            nullable: false
        - name: deleted_apps
          type:
            scalar: bigint
            nullable: false
        - name: deleted_teams
          type:
            scalar: bigint
            nullable: false
        - name: new_apps
          type:
            scalar: bigint
            nullable: false
        - name: new_teams
          type:
            scalar: bigint
            nullable: false
        - name: new_users
          type:
            scalar: bigint
            nullable: false
        - name: pending_invites
          type:
            scalar: bigint
            nullable: false
        - name: total_users
          type:
            scalar: bigint
            nullable: false
      select_permissions:
        - role: internal_dashboard_readonly
          permission:
            columns:
              - active_api_keys
              - active_apps
              - active_teams
              - deleted_apps
              - deleted_teams
              - new_apps
              - new_teams
              - new_users
              - pending_invites
              - total_users
            filter: {}
    - name: admin_dashboard_queue
      fields:
        - name: email
          type:
            scalar: varchar
            nullable: true
        - name: id
          type:
            scalar: varchar
            nullable: false
        - name: kind
          type:
            scalar: varchar
            nullable: false
        - name: name
          type:
            scalar: varchar
            nullable: true
        - name: owner_email
          type:
            scalar: varchar
            nullable: true
        - name: owner_id
          type:
            scalar: varchar
            nullable: true
        - name: owner_name
          type:
            scalar: varchar
            nullable: true
        - name: team_id
          type:
            scalar: varchar
            nullable: true
        - name: total_count
          type:
            scalar: bigint
            nullable: false
        - name: updated_at
          type:
            scalar: timestamptz
            nullable: true
      select_permissions:
        - role: internal_dashboard_readonly
          permission:
            columns:
              - email
              - id
              - kind
              - name
              - owner_email
              - owner_id
              - owner_name
              - team_id
              - total_count
              - updated_at
            filter: {}
    - name: admin_rp_inventory
      fields:
        - name: total_rps
          type:
            scalar: bigint
            nullable: false
        - name: managed_rps
          type:
            scalar: bigint
            nullable: false
        - name: self_managed_rps
          type:
            scalar: bigint
            nullable: false
        - name: managed_with_key
          type:
            scalar: bigint
            nullable: false
        - name: managed_without_key
          type:
            scalar: bigint
            nullable: false
        - name: unique_manager_key_rps
          type:
            scalar: bigint
            nullable: false
        - name: shared_manager_key_rps
          type:
            scalar: bigint
            nullable: false
        - name: status_pending
          type:
            scalar: bigint
            nullable: false
        - name: status_registered
          type:
            scalar: bigint
            nullable: false
        - name: status_failed
          type:
            scalar: bigint
            nullable: false
        - name: status_deactivated
          type:
            scalar: bigint
            nullable: false
        - name: staging_status_pending
          type:
            scalar: bigint
            nullable: false
        - name: staging_status_registered
          type:
            scalar: bigint
            nullable: false
        - name: staging_status_failed
          type:
            scalar: bigint
            nullable: false
        - name: staging_status_deactivated
          type:
            scalar: bigint
            nullable: false
        - name: staging_status_null
          type:
            scalar: bigint
            nullable: false
      select_permissions:
        - role: internal_dashboard_readonly
          permission:
            columns:
              - total_rps
              - managed_rps
              - self_managed_rps
              - managed_with_key
              - managed_without_key
              - unique_manager_key_rps
              - shared_manager_key_rps
              - status_pending
              - status_registered
              - status_failed
              - status_deactivated
              - staging_status_pending
              - staging_status_registered
              - staging_status_failed
              - staging_status_deactivated
              - staging_status_null
            filter: {}
    # TODO: remove after the RP manager key migration completes
    - name: admin_rp_manager_key_migration
      fields:
        - name: remaining_cron_candidates
          type:
            scalar: bigint
            nullable: false
        - name: unique_excluded_from_cron
          type:
            scalar: bigint
            nullable: false
        - name: on_shared_with_audit
          type:
            scalar: bigint
            nullable: false
        - name: on_shared_without_audit
          type:
            scalar: bigint
            nullable: false
        - name: unique_with_audit
          type:
            scalar: bigint
            nullable: false
        - name: audit_pending
          type:
            scalar: bigint
            nullable: false
        - name: audit_failed
          type:
            scalar: bigint
            nullable: false
        - name: audit_blocked
          type:
            scalar: bigint
            nullable: false
        - name: audit_ready_for_external_cleanup
          type:
            scalar: bigint
            nullable: false
        - name: audit_deletion_scheduled
          type:
            scalar: bigint
            nullable: false
        - name: audit_deleted
          type:
            scalar: bigint
            nullable: false
        - name: audit_deletion_overdue
          type:
            scalar: bigint
            nullable: false
      select_permissions:
        - role: internal_dashboard_readonly
          permission:
            columns:
              - remaining_cron_candidates
              - unique_excluded_from_cron
              - on_shared_with_audit
              - on_shared_without_audit
              - unique_with_audit
              - audit_pending
              - audit_failed
              - audit_blocked
              - audit_ready_for_external_cleanup
              - audit_deletion_scheduled
              - audit_deleted
              - audit_deletion_overdue
            filter: {}
    # TODO: remove after the RP manager key migration completes
    - name: admin_rp_manager_key_migration_queue
      fields:
        - name: kind
          type:
            scalar: varchar
            nullable: false
        - name: rp_id
          type:
            scalar: varchar
            nullable: false
        - name: app_id
          type:
            scalar: varchar
            nullable: false
        - name: app_name
          type:
            scalar: varchar
            nullable: true
        - name: updated_at
          type:
            scalar: timestamptz
            nullable: true
        - name: cleanup_status
          type:
            scalar: text
            nullable: true
        - name: last_error_detail
          type:
            scalar: text
            nullable: true
        - name: expected_deletion_at
          type:
            scalar: timestamptz
            nullable: true
        - name: total_count
          type:
            scalar: bigint
            nullable: false
      select_permissions:
        - role: internal_dashboard_readonly
          permission:
            columns:
              - kind
              - rp_id
              - app_id
              - app_name
              - updated_at
              - cleanup_status
              - last_error_detail
              - expected_deletion_at
              - total_count
            filter: {}
  native_queries:
    - root_field_name: admin_dashboard_inventory
      arguments: {}
      code: |
        WITH team_counts AS (
          SELECT
            COUNT(*) FILTER (WHERE deleted_at IS NULL) AS active_teams,
            COUNT(*) FILTER (WHERE deleted_at IS NOT NULL) AS deleted_teams,
            COUNT(*) FILTER (
              WHERE deleted_at IS NULL
                AND created_at >= CURRENT_TIMESTAMP - INTERVAL '30 days'
            ) AS new_teams
          FROM public.team
        ),
        user_counts AS (
          SELECT
            COUNT(*) AS total_users,
            COUNT(*) FILTER (
              WHERE created_at >= CURRENT_TIMESTAMP - INTERVAL '30 days'
            ) AS new_users
          FROM public."user"
        ),
        app_counts AS (
          SELECT
            COUNT(*) FILTER (WHERE deleted_at IS NULL) AS active_apps,
            COUNT(*) FILTER (WHERE deleted_at IS NOT NULL) AS deleted_apps,
            COUNT(*) FILTER (
              WHERE deleted_at IS NULL
                AND created_at >= CURRENT_TIMESTAMP - INTERVAL '30 days'
            ) AS new_apps
          FROM public.app
        ),
        invite_counts AS (
          SELECT COUNT(*) AS pending_invites
          FROM public.invite
          WHERE expires_at >= CURRENT_TIMESTAMP
        ),
        api_key_counts AS (
          SELECT COUNT(*) AS active_api_keys
          FROM public.api_key
          WHERE is_active = true
        )
        SELECT
          api_key_counts.active_api_keys,
          app_counts.active_apps,
          team_counts.active_teams,
          app_counts.deleted_apps,
          team_counts.deleted_teams,
          app_counts.new_apps,
          team_counts.new_teams,
          user_counts.new_users,
          invite_counts.pending_invites,
          user_counts.total_users
        FROM team_counts, user_counts, app_counts, invite_counts, api_key_counts
      returns: admin_dashboard_inventory
    - root_field_name: admin_rp_inventory
      arguments: {}
      code: |
        SELECT
          COUNT(*)::bigint AS total_rps,
          COUNT(*) FILTER (WHERE mode = 'managed')::bigint AS managed_rps,
          COUNT(*) FILTER (WHERE mode = 'self_managed')::bigint AS self_managed_rps,
          COUNT(*) FILTER (
            WHERE mode = 'managed' AND manager_kms_key_id IS NOT NULL
          )::bigint AS managed_with_key,
          COUNT(*) FILTER (
            WHERE mode = 'managed' AND manager_kms_key_id IS NULL
          )::bigint AS managed_without_key,
          COUNT(*) FILTER (
            WHERE mode = 'managed' AND is_unique_manager_key = true
          )::bigint AS unique_manager_key_rps,
          COUNT(*) FILTER (
            WHERE mode = 'managed' AND is_unique_manager_key = false
          )::bigint AS shared_manager_key_rps,
          COUNT(*) FILTER (WHERE status = 'pending')::bigint AS status_pending,
          COUNT(*) FILTER (WHERE status = 'registered')::bigint AS status_registered,
          COUNT(*) FILTER (WHERE status = 'failed')::bigint AS status_failed,
          COUNT(*) FILTER (WHERE status = 'deactivated')::bigint AS status_deactivated,
          COUNT(*) FILTER (WHERE staging_status = 'pending')::bigint AS staging_status_pending,
          COUNT(*) FILTER (WHERE staging_status = 'registered')::bigint AS staging_status_registered,
          COUNT(*) FILTER (WHERE staging_status = 'failed')::bigint AS staging_status_failed,
          COUNT(*) FILTER (WHERE staging_status = 'deactivated')::bigint AS staging_status_deactivated,
          COUNT(*) FILTER (WHERE staging_status IS NULL)::bigint AS staging_status_null
        FROM public.rp_registration
      returns: admin_rp_inventory
    - root_field_name: admin_dashboard_queues
      arguments: {}
      code: |
        WITH apps_awaiting_review AS (
          SELECT
            'apps_awaiting_review'::varchar AS kind,
            app.id,
            COALESCE(app_metadata.name, app.name) AS name,
            app.team_id,
            COUNT(*) OVER() AS total_count,
            app_metadata.updated_at
          FROM public.app
          JOIN public.app_metadata ON app_metadata.app_id = app.id
          WHERE app.deleted_at IS NULL
            AND app_metadata.verification_status = 'awaiting_review'
          ORDER BY app.created_at DESC
          LIMIT 5
        ),
        apps_changes_requested AS (
          SELECT
            'apps_changes_requested'::varchar AS kind,
            app.id,
            COALESCE(app_metadata.name, app.name) AS name,
            app.team_id,
            COUNT(*) OVER() AS total_count,
            app_metadata.updated_at
          FROM public.app
          JOIN public.app_metadata ON app_metadata.app_id = app.id
          WHERE app.deleted_at IS NULL
            AND app_metadata.verification_status = 'changes_requested'
          ORDER BY app.created_at DESC
          LIMIT 5
        ),
        apps_without_metadata AS (
          SELECT
            'apps_without_metadata'::varchar AS kind,
            app.id,
            app.name,
            app.team_id,
            COUNT(*) OVER() AS total_count,
            NULL::timestamptz AS updated_at
          FROM public.app
          WHERE app.deleted_at IS NULL
            AND NOT EXISTS (
              SELECT 1
              FROM public.app_metadata
              WHERE app_metadata.app_id = app.id
            )
          ORDER BY app.created_at DESC
          LIMIT 5
        ),
        teams_without_owner AS (
          SELECT
            'teams_without_owner'::varchar AS kind,
            team.id,
            team.name,
            COUNT(*) OVER() AS total_count
          FROM public.team
          WHERE team.deleted_at IS NULL
            AND NOT EXISTS (
              SELECT 1
              FROM public.membership
              WHERE membership.team_id = team.id
                AND membership.role = 'OWNER'
            )
          ORDER BY team.created_at DESC
          LIMIT 5
        ),
        sole_owner_teams AS (
          SELECT
            'sole_owner_teams'::varchar AS kind,
            team.id,
            team.name,
            owner.email AS owner_email,
            owner.id AS owner_id,
            owner.name AS owner_name,
            COUNT(*) OVER() AS total_count
          FROM (
            SELECT membership.team_id
            FROM public.membership
            WHERE membership.role = 'OWNER'
            GROUP BY membership.team_id
            HAVING COUNT(*) = 1
          ) AS sole_owner_memberships
          JOIN public.team ON team.id = sole_owner_memberships.team_id
          JOIN public.membership ON membership.team_id = team.id
            AND membership.role = 'OWNER'
          JOIN public."user" AS owner ON owner.id = membership.user_id
          WHERE team.deleted_at IS NULL
          ORDER BY team.created_at DESC
          LIMIT 5
        ),
        users_without_teams AS (
          SELECT
            'users_without_teams'::varchar AS kind,
            "user".id,
            "user".name,
            "user".email,
            COUNT(*) OVER() AS total_count
          FROM public."user"
          WHERE NOT EXISTS (
            SELECT 1
            FROM public.membership
            WHERE membership.user_id = "user".id
          )
          ORDER BY "user".created_at DESC
          LIMIT 5
        )
        SELECT
          kind,
          id,
          name,
          team_id,
          NULL::varchar AS email,
          NULL::varchar AS owner_email,
          NULL::varchar AS owner_id,
          NULL::varchar AS owner_name,
          total_count,
          updated_at
        FROM apps_awaiting_review
        UNION ALL
        SELECT
          kind,
          id,
          name,
          team_id,
          NULL::varchar,
          NULL::varchar,
          NULL::varchar,
          NULL::varchar,
          total_count,
          updated_at
        FROM apps_changes_requested
        UNION ALL
        SELECT
          kind,
          id,
          name,
          team_id,
          NULL::varchar,
          NULL::varchar,
          NULL::varchar,
          NULL::varchar,
          total_count,
          updated_at
        FROM apps_without_metadata
        UNION ALL
        SELECT
          kind,
          id,
          name,
          NULL::varchar,
          NULL::varchar,
          NULL::varchar,
          NULL::varchar,
          NULL::varchar,
          total_count,
          NULL::timestamptz
        FROM teams_without_owner
        UNION ALL
        SELECT
          kind,
          id,
          name,
          NULL::varchar,
          NULL::varchar,
          owner_email,
          owner_id,
          owner_name,
          total_count,
          NULL::timestamptz
        FROM sole_owner_teams
        UNION ALL
        SELECT
          kind,
          id,
          name,
          NULL::varchar,
          email,
          NULL::varchar,
          NULL::varchar,
          NULL::varchar,
          total_count,
          NULL::timestamptz
        FROM users_without_teams
      returns: admin_dashboard_queue
    # TODO: remove after the RP manager key migration completes
    - root_field_name: admin_rp_manager_key_migration
      arguments: {}
      code: |
        WITH cron_candidate AS (
          SELECT r.rp_id
          FROM public.rp_registration r
          JOIN public.app a ON a.id = r.app_id
          WHERE r.mode = 'managed'
            AND r.status = 'registered'
            AND r.signer_address IS NOT NULL
            AND r.manager_kms_key_id IS NOT NULL
            AND r.is_unique_manager_key
            AND a.status = 'active'
            AND NOT a.is_archived
            AND a.deleted_at IS NULL
        ),
        unique_managed AS (
          SELECT r.rp_id
          FROM public.rp_registration r
          WHERE r.mode = 'managed'
            AND r.is_unique_manager_key
            AND r.manager_kms_key_id IS NOT NULL
        ),
        shared_managed AS (
          SELECT r.rp_id
          FROM public.rp_registration r
          WHERE r.mode = 'managed'
            AND NOT r.is_unique_manager_key
            AND r.manager_kms_key_id IS NOT NULL
        ),
        audit_counts AS (
          SELECT
            COUNT(*) FILTER (WHERE cleanup_status = 'pending')::bigint AS audit_pending,
            COUNT(*) FILTER (WHERE cleanup_status = 'failed')::bigint AS audit_failed,
            COUNT(*) FILTER (WHERE cleanup_status = 'blocked')::bigint AS audit_blocked,
            COUNT(*) FILTER (
              WHERE cleanup_status = 'ready_for_external_cleanup'
            )::bigint AS audit_ready_for_external_cleanup,
            COUNT(*) FILTER (
              WHERE cleanup_status = 'deletion_scheduled'
            )::bigint AS audit_deletion_scheduled,
            COUNT(*) FILTER (WHERE cleanup_status = 'deleted')::bigint AS audit_deleted,
            COUNT(*) FILTER (
              WHERE cleanup_status = 'deletion_scheduled'
                AND expected_deletion_at <= CURRENT_TIMESTAMP
            )::bigint AS audit_deletion_overdue
          FROM public.rp_manager_key_migration_audit
        )
        SELECT
          (SELECT COUNT(*)::bigint FROM cron_candidate) AS remaining_cron_candidates,
          (
            SELECT COUNT(*)::bigint
            FROM unique_managed u
            WHERE NOT EXISTS (
              SELECT 1 FROM cron_candidate c WHERE c.rp_id = u.rp_id
            )
          ) AS unique_excluded_from_cron,
          (
            SELECT COUNT(*)::bigint
            FROM shared_managed s
            WHERE EXISTS (
              SELECT 1
              FROM public.rp_manager_key_migration_audit m
              WHERE m.rp_id = s.rp_id
            )
          ) AS on_shared_with_audit,
          (
            SELECT COUNT(*)::bigint
            FROM shared_managed s
            WHERE NOT EXISTS (
              SELECT 1
              FROM public.rp_manager_key_migration_audit m
              WHERE m.rp_id = s.rp_id
            )
          ) AS on_shared_without_audit,
          (
            SELECT COUNT(*)::bigint
            FROM public.rp_manager_key_migration_audit m
            JOIN public.rp_registration r ON r.rp_id = m.rp_id
            WHERE r.is_unique_manager_key
          ) AS unique_with_audit,
          audit_counts.audit_pending,
          audit_counts.audit_failed,
          audit_counts.audit_blocked,
          audit_counts.audit_ready_for_external_cleanup,
          audit_counts.audit_deletion_scheduled,
          audit_counts.audit_deleted,
          audit_counts.audit_deletion_overdue
        FROM audit_counts
      returns: admin_rp_manager_key_migration
    # TODO: remove after the RP manager key migration completes
    - root_field_name: admin_rp_manager_key_migration_queue
      arguments: {}
      code: |
        WITH remaining_cron_candidate AS (
          SELECT
            'remaining_cron_candidate'::varchar AS kind,
            r.rp_id,
            r.app_id,
            a.name AS app_name,
            r.updated_at,
            NULL::text AS cleanup_status,
            NULL::text AS last_error_detail,
            NULL::timestamptz AS expected_deletion_at,
            COUNT(*) OVER() AS total_count
          FROM public.rp_registration r
          JOIN public.app a ON a.id = r.app_id
          WHERE r.mode = 'managed'
            AND r.status = 'registered'
            AND r.signer_address IS NOT NULL
            AND r.manager_kms_key_id IS NOT NULL
            AND r.is_unique_manager_key
            AND a.status = 'active'
            AND NOT a.is_archived
            AND a.deleted_at IS NULL
          ORDER BY r.updated_at ASC, r.created_at ASC
          LIMIT 20
        ),
        cleanup_needs_attention AS (
          SELECT
            'cleanup_needs_attention'::varchar AS kind,
            m.rp_id,
            m.app_id,
            a.name AS app_name,
            m.updated_at,
            m.cleanup_status,
            m.last_error_detail,
            m.expected_deletion_at,
            COUNT(*) OVER() AS total_count
          FROM public.rp_manager_key_migration_audit m
          LEFT JOIN public.app a ON a.id = m.app_id
          WHERE m.cleanup_status IN (
              'failed',
              'blocked',
              'ready_for_external_cleanup'
            )
            OR (
              m.cleanup_status = 'deletion_scheduled'
              AND m.expected_deletion_at <= CURRENT_TIMESTAMP
            )
          ORDER BY m.updated_at ASC, m.created_at ASC
          LIMIT 20
        )
        SELECT
          kind,
          rp_id,
          app_id,
          app_name,
          updated_at,
          cleanup_status,
          last_error_detail,
          expected_deletion_at,
          total_count
        FROM remaining_cron_candidate
        UNION ALL
        SELECT
          kind,
          rp_id,
          app_id,
          app_name,
          updated_at,
          cleanup_status,
          last_error_detail,
          expected_deletion_at,
          total_count
        FROM cleanup_needs_attention
      returns: admin_rp_manager_key_migration_queue
