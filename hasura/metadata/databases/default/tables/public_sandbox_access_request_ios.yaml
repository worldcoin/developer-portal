table:
  name: sandbox_access_request_ios
  schema: public
object_relationships:
  - name: team
    using:
      foreign_key_constraint_on: team_id
  - name: user
    using:
      foreign_key_constraint_on: user_id
insert_permissions:
  - role: service
    permission:
      check: {}
      columns:
        - asc_email
        - portal_email
        - team_id
        - user_id
select_permissions:
  - role: internal_dashboard_readonly
    permission:
      columns:
        - id
        - user_id
        - portal_email
        - asc_email
        - team_id
        - status
        - created_at
        - updated_at
      filter: {}
      allow_aggregations: true
  - role: service
    permission:
      columns:
        - id
        - user_id
        - portal_email
        - asc_email
        - team_id
        - status
        - created_at
        - updated_at
      filter: {}
update_permissions:
  - role: internal_dashboard_readonly
    permission:
      columns:
        - status
      filter: {}
      check: {}
  # Hasura exposes `on_conflict` only when the caller also has update
  # permission. The service mutation uses `update_columns: []` strictly for
  # idempotent insert-or-ignore behavior, so keep ordinary service updates
  # unusable with a filter that cannot match this table's non-null primary key.
  - role: service
    permission:
      columns:
        - asc_email
      filter:
        id:
          _is_null: true
      check: {}
delete_permissions:
  - role: internal_dashboard_readonly
    permission:
      filter:
        status:
          _eq: pending
