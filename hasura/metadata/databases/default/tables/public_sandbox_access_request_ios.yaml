table:
  name: sandbox_access_request_ios
  schema: public
object_relationships:
  - name: user
    using:
      foreign_key_constraint_on: user_id
insert_permissions:
  - role: service
    permission:
      check: {}
      columns:
        - asc_email
        - portal_email
        - team_id
        - user_id
select_permissions:
  - role: internal_dashboard_readonly
    permission:
      columns:
        - id
        - user_id
        - portal_email
        - asc_email
        - team_id
        - status
        - created_at
        - updated_at
      filter: {}
      allow_aggregations: true
  - role: service
    permission:
      columns:
        - id
        - user_id
        - portal_email
        - asc_email
        - team_id
        - status
        - created_at
        - updated_at
      filter: {}
update_permissions:
  - role: internal_dashboard_readonly
    permission:
      columns:
        - status
      filter: {}
      check: {}
delete_permissions:
  - role: internal_dashboard_readonly
    permission:
      filter:
        status:
          _eq: pending
