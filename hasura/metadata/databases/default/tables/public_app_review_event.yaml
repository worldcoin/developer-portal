table:
  name: app_review_event
  schema: public
object_relationships:
  - name: submission
    using:
      foreign_key_constraint_on: submission_id
insert_permissions:
  - role: service
    permission:
      check: {}
      columns:
        - actor_email
        - actor_subject
        - event_type
        - payload
        - review_version
        - submission_id
select_permissions:
  - role: internal_dashboard_readonly
    permission:
      columns:
        - actor_email
        - actor_subject
        - created_at
        - event_type
        - event_sequence
        - id
        - payload
        - review_version
        - submission_id
      filter: {}
      allow_aggregations: true
  - role: service
    permission:
      columns:
        - actor_email
        - actor_subject
        - created_at
        - event_type
        - event_sequence
        - id
        - payload
        - review_version
        - submission_id
      filter: {}
