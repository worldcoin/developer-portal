table:
  name: app_review_submission
  schema: public
object_relationships:
  - name: app
    using:
      foreign_key_constraint_on: app_id
  - name: app_metadata
    using:
      manual_configuration:
        column_mapping:
          app_metadata_id: id
        insertion_order: null
        remote_table:
          name: app_metadata
          schema: public
  - name: team
    using:
      foreign_key_constraint_on: team_id
array_relationships:
  - name: events
    using:
      foreign_key_constraint_on:
        column: submission_id
        table:
          name: app_review_event
          schema: public
  - name: notifications
    using:
      foreign_key_constraint_on:
        column: submission_id
        table:
          name: app_review_notification
          schema: public
insert_permissions:
  - role: service
    permission:
      check: {}
      columns:
        - app_id
        - app_metadata_id
        - app_mode
        - asset_snapshot
        - attempt
        - changelog
        - checklist
        - checklist_version
        - listing_consent
        - listing_target
        - localizations_snapshot
        - metadata_snapshot
        - metadata_updated_at
        - submitted_at
        - submitted_by_email
        - submitted_by_subject
        - team_id
select_permissions:
  - role: internal_dashboard_readonly
    permission:
      columns:
        - app_id
        - app_metadata_id
        - app_mode
        - asset_snapshot
        - asset_snapshot_repair_attempt_count
        - asset_snapshot_repair_dead_lettered_at
        - asset_snapshot_repair_last_error
        - asset_snapshot_repair_next_at
        - attempt
        - changelog
        - checklist
        - checklist_version
        - claim_expires_at
        - claimed_at
        - claimed_by_email
        - completed_at
        - created_at
        - decided_at
        - decided_by_email
        - decision_summary
        - id
        - listing_consent
        - listing_target
        - localizations_snapshot
        - metadata_snapshot
        - metadata_updated_at
        - review_version
        - status
        - submitted_at
        - team_id
        - updated_at
        - world_id_configuration_snapshot
      filter: {}
      allow_aggregations: true
  - role: service
    permission:
      columns:
        - app_id
        - app_metadata_id
        - app_mode
        - asset_snapshot_repair_attempt_count
        - asset_snapshot_repair_dead_lettered_at
        - asset_snapshot_repair_last_error
        - asset_snapshot_repair_next_at
        - asset_snapshot
        - attempt
