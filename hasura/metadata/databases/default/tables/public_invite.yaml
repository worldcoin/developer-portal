table:
  name: invite
  schema: public
object_relationships:
  - name: team
    using:
      foreign_key_constraint_on: team_id
insert_permissions:
  # Internal dashboard users invite people into a customer team. The role
  # column is limited to ADMIN/MEMBER by a database constraint, and invites
  # into soft-deleted teams are rejected.
  - role: internal_dashboard_readonly
    permission:
      check:
        team:
          deleted_at:
            _is_null: true
      columns:
        - email
        - role
        - team_id
  - role: service
    permission:
      check: {}
      columns:
        - email
        - team_id
select_permissions:
  - role: internal_dashboard_readonly
    permission:
      columns:
        - id
        - email
        - expires_at
        - role
        - team_id
      filter: {}
      allow_aggregations: true
  - role: service
    permission:
      columns:
        - id
        - team_id
        - email
        - expires_at
      filter: {}
  - role: user
    permission:
      columns:
        - email
        - expires_at
        - id
        - team_id
      filter:
        team:
          memberships:
            _and:
              - role:
                  _eq: OWNER
              - user_id:
                  _eq: X-Hasura-User-Id
update_permissions:
  # Re-inviting an existing pending invite refreshes its expiry and role.
  - role: internal_dashboard_readonly
    permission:
      columns:
        - expires_at
        - role
      filter:
        team:
          deleted_at:
            _is_null: true
      check: {}
  - role: service
    permission:
      columns:
        - expires_at
      filter: {}
      check: null
delete_permissions:
  - role: service
    permission:
      filter: {}
  - role: user
    permission:
      filter:
        team:
          memberships:
            _and:
              - role:
                  _eq: OWNER
              - user_id:
                  _eq: X-Hasura-User-Id
